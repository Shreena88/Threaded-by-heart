<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Threaded by Heart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --rose: #c9748a; --rose-light: #f2c4ce; --rose-pale: #fdf0f3;
      --cream: #fdf8f2; --text-dark: #3d2535; --text-mid: #7a4f5e;
      --text-light: #b08090; --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--cream); min-height: 100vh; display: flex; flex-direction: column; }

    .navbar {
      background: var(--white); display: flex; justify-content: space-between;
      align-items: center; padding: 0 40px; height: 70px;
      box-shadow: 0 2px 20px rgba(180,100,120,0.08);
    }
    .logo2 img { height: 46px; }
    .nav-links { list-style: none; display: flex; align-items: center; gap: 8px; }
    .nav-links li a {
      text-decoration: none; color: var(--text-mid); font-weight: 500;
      font-size: 0.9rem; padding: 6px 14px; border-radius: 20px; transition: all 0.25s;
    }
    .nav-links li a:hover { background: var(--rose-pale); color: var(--rose); }

    .main-content {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--rose-pale) 0%, var(--cream) 100%);
    }
    .auth-card {
      background: var(--white); border-radius: 24px;
      box-shadow: 0 20px 60px rgba(180,100,120,0.15);
      width: 100%; max-width: 420px; overflow: hidden;
    }
    .auth-card-header {
      background: linear-gradient(135deg, var(--rose) 0%, #b5607a 100%);
      padding: 36px 40px 28px;
      text-align: center;
    }
    .auth-card-header h2 {
      font-family: 'Playfair Display', serif;
      color: var(--white); font-size: 1.9rem; margin-bottom: 6px;
    }
    .auth-card-header p { color: rgba(255,255,255,0.8); font-size: 0.88rem; }
    .auth-card-body { padding: 36px 40px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-mid); margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 0.9rem; }
    .form-group input {
      width: 100%; padding: 12px 14px 12px 40px;
      border: 2px solid #f0e0e5; border-radius: 10px;
      font-size: 0.95rem; font-family: 'Poppins', sans-serif;
      color: var(--text-dark); background: var(--cream);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .form-group input:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px rgba(201,116,138,0.12); background: var(--white); }

    .btn-submit {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--rose) 0%, #b5607a 100%);
      color: var(--white); border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; font-family: 'Poppins', sans-serif;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(180,100,120,0.3);
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(180,100,120,0.4); }

    .auth-footer { text-align: center; margin-top: 22px; font-size: 0.88rem; color: var(--text-light); }
    .auth-footer a { color: var(--rose); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

    .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 18px; display: none; }
    .alert-error { background: #fde8ec; color: #9b2335; border: 1px solid #f5c0c8; }
    .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo2"><img src="../logo.png" alt="Threaded by Heart"></div>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="aboutus.html">About Us</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="main-content">
    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>
      <div class="auth-card-body">
        <div id="alertError" class="alert alert-error"></div>
        <div id="alertSuccess" class="alert alert-success"></div>
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" placeholder="you@example.com" required>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" placeholder="Enter your password" required>
            </div>
          </div>
          <button type="submit" class="btn-submit">Sign In</button>
        </form>
        <div class="auth-footer">
          <p>Don't have an account? <a href="register.html">Create one</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errDiv = document.getElementById('alertError');
      const okDiv = document.getElementById('alertSuccess');
      errDiv.style.display = 'none'; okDiv.style.display = 'none';
      try {
        const res = await fetch('http://localhost:5000/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (res.ok) {
          okDiv.textContent = 'Login successful! Redirecting...';
          okDiv.style.display = 'block';
          localStorage.setItem('user', JSON.stringify(data.user));
          // Return to page they came from, or home
          const returnTo = sessionStorage.getItem('loginReturnTo') || 'home.html';
          sessionStorage.removeItem('loginReturnTo');
          setTimeout(() => window.location.href = returnTo, 800);
        } else {
          errDiv.textContent = data.error || 'Login failed. Please try again.';
          errDiv.style.display = 'block';
        }
      } catch {
        errDiv.textContent = 'Network error. Please try again.';
        errDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
